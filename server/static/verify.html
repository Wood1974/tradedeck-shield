<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeDeck Shield Verification</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:20px;background:#0b0d10;color:#f5f7fa}input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}button{font-weight:700}pre{white-space:pre-wrap;background:#15191f;padding:16px;border-radius:8px}.muted{color:#aab2bd}</style></head><body><h1>TradeDeck Shield</h1><h2>Independent evidence verification</h2><p class="muted">Verification checks cryptographic consistency. It does not prove that a human statement is true or that GPS establishes physical presence.</p><form id=f><input name=evidence_id placeholder="Evidence ID" required><input name=location_stated placeholder="Attested location/context (optional)"><input name=purpose placeholder="Attested purpose (optional)"><label>Original JPEG (optional)<input name=photo type=file accept="image/jpeg"></label><button>Verify</button></form><pre id=o>Enter an Evidence ID.</pre><script>f.onsubmit=async e=>{e.preventDefault();o.textContent='Checking…';let d=new FormData(f);if(!d.get('photo').size)d.delete('photo');for(let k of ['location_stated','purpose'])if(!d.get(k))d.delete(k);let r=await fetch('/shield/v1/verify',{method:'POST',body:d});o.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
