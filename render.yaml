services:
  - type: web
    name: tradedeck-shield
    runtime: docker
    plan: starter
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /shield/v1/health
    disk:
      name: shield-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: SHIELD_API_AUTH_MODE
        value: local
      - key: SHIELD_ATTESTATION_MODE
        value: production
      - key: SHIELD_PLAY_INTEGRITY_MODE
        value: production
      - key: SHIELD_AUTHZ_MODE
        value: local
      - key: SHIELD_RATE_LIMIT_PER_MINUTE
        value: '30'
      - key: SHIELD_LOCAL_JWT_SECRET
        generateValue: true
      - key: SHIELD_APP_ID
        sync: false
      - key: SHIELD_PLAY_PACKAGE_NAME
        value: com.tradedeck.shield
      - key: GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON
        sync: false
