name: Shield iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion for this TestFlight build"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require signing credentials
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: 2FQX7UHKNU
          ASC_ISSUER: b00416ce-6169-4876-a31c-f3f4a30cc74c
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          for v in CERT CERT_PASSWORD PROFILE ASC_KEY; do
            test -n "${!v}" || { echo "::error::Missing required Apple signing/TestFlight secret: $v"; exit 1; }
          done

      - name: Install Apple distribution certificate
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/shield-signing.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "shield-ci" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "shield-ci" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "shield-ci" "$KEYCHAIN"

      - name: Install App Store provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" ios/ShieldCamera/Info.plist

      - name: Archive production app
        run: |
          xcodebuild             -project ios/ShieldCamera/ShieldCamera.xcodeproj             -scheme ShieldCamera             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/TradeDeckShield.xcarchive"             DEVELOPMENT_TEAM=766457AWH4             PRODUCT_BUNDLE_IDENTIFIER=com.tradedeck.shield             archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>766457AWH4</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/TradeDeckShield.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: tradedeck-shield-ios-signed
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/ShieldCamera.ipa
          issuer-id: b00416ce-6169-4876-a31c-f3f4a30cc74c
          api-key-id: 2FQX7UHKNU
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
