name: Shield secret-name diagnostic
on:
  push:
    branches:
      - fix/authoritative-capture-location
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: List relevant available secret names without values
        env:
          SECRET_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          python - <<'PY'
          import json, os
          names = sorted(k for k in json.loads(os.environ['SECRET_CONTEXT'])
                         if k.startswith('IOS_') or k.startswith('APP_STORE_'))
          print('Available Apple-related secret names:', names)
          PY
